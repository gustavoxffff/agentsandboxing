# Configuration for this repository itself (v1 dogfood).
# Precedence: CLI flag > this file > $XDG_CONFIG_HOME/asb/config.toml.
version = 1

[network]
# host | none | allowlist
profile = "host"

# The allowlist only applies with profile = "allowlist". Destinations are host
# names; "*." matches subdomains, not the apex.
# allow = [
#   "github.com",
#   "registry.npmjs.org",
#   "pypi.org",
#   "files.pythonhosted.org",
# ]

[env]
# The v1 base list is PATH, TERM, LANG, LC_ALL, TZ, USER, LOGNAME, SHELL.
# Declaring [env] allow replaces the list (it does not merge).
# allow = ["PATH", "TERM", "LANG", "LC_ALL", "TZ", "USER", "LOGNAME", "SHELL"]
