name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Check docs
        run: ./scripts/check-docs.sh

      - name: Unit tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Matrix dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap curl git nodejs npm python3-pip slirp4netns

      - name: Install pinned Node 24 under /usr/local
        run: |
          version=v24.22.2
          curl -fsSLO "https://nodejs.org/dist/$version/node-$version-linux-x64.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/$version/SHASUMS256.txt"
          grep " node-$version-linux-x64.tar.xz\$" SHASUMS256.txt | sha256sum -c -
          sudo tar -xJf "node-$version-linux-x64.tar.xz" -C /usr/local --strip-components=1
          node --version
          npm --version

      - name: Install pinned OpenCode under /usr/local
        run: |
          sudo npm install -g @opencode/cli@2.1.4
          opencode --version

      - name: Enable user namespaces for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build
        run: go build -o /tmp/asb ./cmd/asb

      - name: Network escape matrix (allowlist gate)
        run: ASB=/tmp/asb scripts/matrix.sh

  mutation-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Gremlins v0.6.0
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Mutation gate on changed Go code
        env:
          MUTATION_REPORT: /tmp/opencode/gremlins-diff.json
        run: scripts/mutation.sh --diff "${{ github.event.pull_request.base.sha }}"

  mutation-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Gremlins v0.6.0
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Weekly full mutation run
        env:
          MUTATION_REPORT: /tmp/opencode/gremlins-full.json
        run: scripts/mutation.sh --full

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlins-full
          path: /tmp/opencode/gremlins-full.json
          if-no-files-found: ignore
