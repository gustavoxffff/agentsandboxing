name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Check docs
        run: ./scripts/check-docs.sh

      - name: Unit tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Matrix dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap curl git nodejs npm python3-pip

      - name: Enable user namespaces for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build
        run: go build -o /tmp/asb ./cmd/asb

      - name: Network escape matrix (allowlist gate)
        run: ASB=/tmp/asb scripts/matrix.sh
