name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Testes unitários
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Dependências da matriz
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap curl git nodejs npm python3-pip

      - name: Habilitar user namespaces para o bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build
        run: go build -o /tmp/asb ./cmd/asb

      - name: Matriz de fuga (gate do allowlist)
        run: ASB=/tmp/asb scripts/matrix.sh
